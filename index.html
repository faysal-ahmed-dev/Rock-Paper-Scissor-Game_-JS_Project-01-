<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="container">

            <div class="header">

                <p class="top-text">Rock Paper Scissor</p>
                <p class="select-move">Select A Move</p>

            </div>

            <div class="moves-container">
                
                <button class="rock-box">
                    <img class="moves-image" src="resources/rock.jpeg" alt="Rock">
                </button>
                
                <button class="paper-box">
                    <img class="moves-image" src="resources/paper.jpeg" alt="Rock">
                </button>

                <button class="scissor-box">
                    <img class="moves-image" src="resources/scissor.jpeg" alt="Rock">
                </button>

            </div> <!--moves container-->

            <div class="result">
                <p class="result-text">You Won</p>
            </div>

            <div class="versus-box">

                <div class="your-pick">
                    <p>You -</p>
                    <img src="resources/scissor-transparent.png" alt="Scissor">
                </div>

                <div>
                    <p class="vs">VS</p>
                </div>

                
                <div class="computer-pick">
                    <img src="resources/paper-transparent.png" alt="Scissor">
                    <p>- Computer</p>
                </div>

            </div> <!--versus-output-->

            <div class="score-board">

                <p class="wins">Wins: 2</p>
                <p class="loses">Loses: 1</p>
                <p class="ties">Ties: 3</p>

            </div>

            <div class="score-reset">
                <button class="reset-button">Reset Score</button>
            </div>

        </div> <!--container-->

    </main>


    <script src="script.js"></script>
</body>
</html>
