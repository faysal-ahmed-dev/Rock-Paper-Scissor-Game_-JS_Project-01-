<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        <div class="container">

            <div class="header">

                <p class="top-text">Rock Paper Scissor</p>
                <p class="select-move">Please Select A Move</p>

            </div>

            <div class="moves-container">
                
                <button class="rock-box" onclick="
                        decideResult('Rock');
                    ">
                    <img class="moves-image" src="resources/rock.jpeg" alt="Rock">
                </button>
                
                <button class="paper-box" onclick="
                    decideResult('Paper');
                ">
                    <img class="moves-image" src="resources/paper.jpeg" alt="Rock">
                </button>

                <button class="scissor-box" onclick="
                    decideResult('Scissor');
                ">
                    <img class="moves-image" src="resources/scissor.jpeg" alt="Rock">
                </button>

            </div> <!--moves container-->

            <div class="result">
                <p class="result-text">Result</p>
            </div>

            <div class="versus-box">

                <div class="your-pick">
                    <p>You -</p>

                    <div class="empty-icon-box">
                        <img class="player-move-icon" >
                    </div>
                </div>

                <div>
                    <p class="vs">VS</p>
                </div>

                
                <div class="computer-pick">
                    
                    <div class="empty-icon-box">
                        <img class="computer-move-icon" >
                    </div>

                    <p>- Computer</p>
                
                </div>

            </div> <!--versus-box-->

            <div class="score-board">

                <p class="scores">Wins: 0 - Loses: 0 - Ties: 0</p>

            </div>

            <div class="score-reset">
                <button class="reset-button" onclick="
                    scoreReset();
                    ">Reset Score</button>
            </div>

        </div> <!--container-->

        
    </main>
    
    <div class="signature-box">
       <p class="signature"> Created by faysal-ahmed-dev </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
